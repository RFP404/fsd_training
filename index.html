<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Management System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to right, #0f172a, #1e293b);
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 40px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 30px;
      color: #cbd5e1;
    }

    button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 15px 30px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: bold;
    }

    button:hover {
      background-color: #0ea5e9;
      transform: scale(1.05);
    }

    #message {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #facc15;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Product Management System</h1>

    <p>
      Manage your products efficiently with our modern product management system.
      Track inventory, organize products, and improve productivity using a simple interface.
    </p>

    <button onclick="showMessage()">
      Get Started
    </button>

    <div id="message"></div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").innerHTML =
        "Welcome! Your Product Management System is ready.";
    }
  </script>

</body>
</html>
